openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Business Automation Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analytics
    description: Analytics and dashboard summary
  - name: leads
    description: CRM lead management
  - name: candidates
    description: HR recruitment candidates
  - name: projects
    description: Project management
  - name: tasks
    description: Project tasks
  - name: chat
    description: AI chatbot assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Analytics / Dashboard ───────────────────────────────────────────────
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get dashboard summary KPIs
      responses:
        "200":
          description: Dashboard KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/revenue:
    get:
      operationId: getRevenueChart
      tags: [analytics]
      summary: Monthly revenue data for chart
      responses:
        "200":
          description: Revenue data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueDataPoint"

  /analytics/activity:
    get:
      operationId: getRecentActivity
      tags: [analytics]
      summary: Recent activity feed
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── CRM Leads ───────────────────────────────────────────────────────────
  /leads:
    get:
      operationId: getLeads
      tags: [leads]
      summary: List all CRM leads
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/pipeline:
    get:
      operationId: getLeadPipeline
      tags: [leads]
      summary: Lead counts and values by pipeline stage
      responses:
        "200":
          description: Pipeline stage breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineStage"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── HR Candidates ───────────────────────────────────────────────────────
  /candidates:
    get:
      operationId: getCandidates
      tags: [candidates]
      summary: List all recruitment candidates
      parameters:
        - in: query
          name: stage
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
      responses:
        "200":
          description: List of candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Add a new candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateInput"
      responses:
        "201":
          description: Created candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"

  /candidates/stages:
    get:
      operationId: getCandidateStages
      tags: [candidates]
      summary: Candidate counts by recruitment stage
      responses:
        "200":
          description: Stage breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StageCount"

  /candidates/{id}:
    patch:
      operationId: updateCandidate
      tags: [candidates]
      summary: Update a candidate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateUpdate"
      responses:
        "200":
          description: Updated candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
    delete:
      operationId: deleteCandidate
      tags: [candidates]
      summary: Delete a candidate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Projects ─────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Project status summary counts
      responses:
        "200":
          description: Project stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Tasks ────────────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      summary: List tasks (optionally filtered by project)
      parameters:
        - in: query
          name: projectId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── AI Chat ─────────────────────────────────────────────────────────────
  /chat/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: Get chat message history
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── Analytics ──────────────────────────────────────────────────────────
    AnalyticsSummary:
      type: object
      required: [totalRevenue, activeLeads, openPositions, activeProjects, revenueGrowth, leadGrowth]
      properties:
        totalRevenue:
          type: number
        activeLeads:
          type: integer
        openPositions:
          type: integer
        activeProjects:
          type: integer
        revenueGrowth:
          type: number
        leadGrowth:
          type: number

    RevenueDataPoint:
      type: object
      required: [month, revenue, target]
      properties:
        month:
          type: string
        revenue:
          type: number
        target:
          type: number

    ActivityItem:
      type: object
      required: [id, type, description, timestamp]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        timestamp:
          type: string

    # ─── CRM ────────────────────────────────────────────────────────────────
    Lead:
      type: object
      required: [id, name, company, email, status, value, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        company:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        status:
          type: string
          enum: [new, contacted, qualified, proposal, negotiation, won, lost]
        value:
          type: number
        source:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    LeadInput:
      type: object
      required: [name, company, email, status, value]
      properties:
        name:
          type: string
        company:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [new, contacted, qualified, proposal, negotiation, won, lost]
        value:
          type: number
        source:
          type: string
        notes:
          type: string

    LeadUpdate:
      type: object
      properties:
        name:
          type: string
        company:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [new, contacted, qualified, proposal, negotiation, won, lost]
        value:
          type: number
        source:
          type: string
        notes:
          type: string

    PipelineStage:
      type: object
      required: [stage, count, value]
      properties:
        stage:
          type: string
        count:
          type: integer
        value:
          type: number

    # ─── HR ─────────────────────────────────────────────────────────────────
    Candidate:
      type: object
      required: [id, name, role, email, stage, appliedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        stage:
          type: string
          enum: [applied, screening, interview, technical, offer, hired, rejected]
        score:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        appliedAt:
          type: string

    CandidateInput:
      type: object
      required: [name, role, email, stage]
      properties:
        name:
          type: string
        role:
          type: string
        email:
          type: string
        phone:
          type: string
        stage:
          type: string
          enum: [applied, screening, interview, technical, offer, hired, rejected]
        score:
          type: integer
        notes:
          type: string

    CandidateUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        email:
          type: string
        phone:
          type: string
        stage:
          type: string
          enum: [applied, screening, interview, technical, offer, hired, rejected]
        score:
          type: integer
        notes:
          type: string

    StageCount:
      type: object
      required: [stage, count]
      properties:
        stage:
          type: string
        count:
          type: integer

    # ─── Projects ────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, name, status, progress, dueDate, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [planning, active, on_hold, completed, cancelled]
        progress:
          type: integer
        priority:
          type: string
          enum: [low, medium, high, critical]
        dueDate:
          type: string
        createdAt:
          type: string

    ProjectInput:
      type: object
      required: [name, status, dueDate]
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [planning, active, on_hold, completed, cancelled]
        progress:
          type: integer
        priority:
          type: string
          enum: [low, medium, high, critical]
        dueDate:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [planning, active, on_hold, completed, cancelled]
        progress:
          type: integer
        priority:
          type: string
          enum: [low, medium, high, critical]
        dueDate:
          type: string

    ProjectStats:
      type: object
      required: [total, active, completed, onHold]
      properties:
        total:
          type: integer
        active:
          type: integer
        completed:
          type: integer
        onHold:
          type: integer

    # ─── Tasks ───────────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, title, status, priority, projectId, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, critical]
        projectId:
          type: integer
        assignee:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        createdAt:
          type: string

    TaskInput:
      type: object
      required: [title, status, priority, projectId]
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, critical]
        projectId:
          type: integer
        assignee:
          type: string
        dueDate:
          type: string

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, critical]
        assignee:
          type: string
        dueDate:
          type: string

    # ─── Chat ─────────────────────────────────────────────────────────────────
    ChatMessage:
      type: object
      required: [id, role, content, timestamp]
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        timestamp:
          type: string

    ChatMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
